<!--
MARCADO DE LA FACHADA DE VÍDEO · plantilla confirmada

La etiqueta del disparador es <a>, NO <button>. Medido en vivo sobre
/producto/hypershell-x-pro-s/: con <button> la fachada se queda en 45 px de alto
en vez de 321, porque el tema le impone su propio padding y su propia altura, y
el CSS de la fachada no lo neutraliza. Con <a> sale limpio: 321 px, imagen a
568x319, sin nada que el tema le meta por debajo.

Y el href apunta al vídeo de verdad, así que si el JS faltara, la fachada sigue
funcionando: abre el vídeo en YouTube. Después del susto de hoy, esa es la
propiedad que más vale.

Se cambian CUATRO cosas por vídeo, y solo cuatro:
  1. el ID, en href y en data-yt
  2. src del <img>    la URL de la miniatura ya subida a la biblioteca
  3. alt del <img>    el texto escrito en cada marcador
  4. el <figcaption>  el pie, también escrito en cada marcador

El <figcaption> NO se quita nunca: es la atribución al fabricante.
La miniatura tiene que salir de maxresdefault (1280x720, ya 16:9). Con
hqdefault (480x360) las bandas negras se colarían en el recorte de object-fit.
-->
